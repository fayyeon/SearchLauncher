<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Launcher - Interactive Prototype</title>
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-color: #000000;
      --search-bg: #222222;
      --on-surface: #FFFFFF;
      --on-surface-variant: #A0A0A0;
      --primary: #FFFFFF;
      --icon-bg: #2A2A2A;
      --icon-fg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d0e12;
      color: #E2E2E9;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .preview-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .preview-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .preview-header p {
      font-size: 15px;
      color: #90909A;
    }

    /* Device Mockup Frame */
    .device-frame {
      width: 380px;
      height: 780px;
      background: #000000;
      border-radius: 46px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 8px #1E2024;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Pure Black Background Layer */
    .launcher-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000000;
      z-index: 2;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      z-index: 5;
    }

    .camera-cutout {
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
    }

    /* Scrollable App List */
    .app-list-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Anchored directly above search bar */
    }

    .app-list-scroll::-webkit-scrollbar {
      display: none;
    }

    /* App Item Row */
    .app-item {
      display: flex;
      align-items: center;
      padding: 11px 24px;
      cursor: pointer;
    }

    .app-item:active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 18px;
    }

    .app-icon svg {
      width: 24px;
      height: 24px;
      fill: var(--icon-fg);
    }

    .app-title {
      font-size: 19px;
      font-weight: 400;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Bar */
    .bottom-bar {
      padding: 10px 16px 20px 16px;
      display: flex;
      align-items: center;
      z-index: 6;
      background: transparent;
    }

    /* Elongated Full-Width Search Pill */
    .search-pill {
      flex: 1;
      height: 56px;
      background-color: var(--search-bg);
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
    }

    .search-icon {
      width: 22px;
      height: 22px;
      opacity: 0.7;
      fill: #FFFFFF;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      color: #FFFFFF;
      font-size: 17px;
      font-family: inherit;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--on-surface-variant);
    }

    .search-clear {
      width: 22px;
      height: 22px;
      opacity: 0.7;
      fill: #FFFFFF;
      cursor: pointer;
      display: none;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      margin-bottom: 24px;
      color: var(--on-surface-variant);
      font-size: 17px;
      display: none;
    }

    .default-state-hint {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #333333;
      font-size: 14px;
      text-align: center;
      padding: 0 32px;
    }
  </style>
</head>
<body>

  <div class="preview-header">
    <h1>Search Launcher (Kotlin & Compose)</h1>
    <p>Pure Black AMOLED • Search-First • Bottom-Anchored Reachability</p>
  </div>

  <!-- Device Frame -->
  <div class="device-frame" id="deviceFrame">
    <!-- Launcher Container -->
    <div class="launcher-container" id="launcherContainer">
      <!-- Status Bar -->
      <div class="status-bar">
        <span id="clock">12:30</span>
        <div class="camera-cutout"></div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.5 3 3.7 4.9 1 8l11 13L23 8c-2.7-3.1-6.5-5-11-5z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <!-- Scrollable App List (Empty by default, apps appear when searched) -->
      <div class="app-list-scroll" id="appListScroll">
        <div class="default-state-hint" id="defaultHint">
          <span>Type to search apps</span>
        </div>
        <div id="appsWrapper"></div>
        <div class="empty-state" id="emptyState">No apps found</div>
      </div>

      <!-- Elongated Full-Width Bottom Search Bar (No 3-dots button) -->
      <div class="bottom-bar">
        <div class="search-pill">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search apps..." autocomplete="off" />
          <svg class="search-clear" id="searchClear" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const APPS = [
      "Camera", "Chrome", "Clock", "Contacts", "Files", "Gallery", "Gmail",
      "Google Maps", "Messages", "Music", "Notes", "Phone", "Play Store",
      "Reddit", "Settings", "Spotify", "Telegram", "Twitter / X", "WhatsApp", "YouTube"
    ];

    const robotSvg = `<svg viewBox="0 0 24 24"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-4.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 2.23 12.95 2 12 2c-.96 0-1.86.23-2.66.63L7.85 1.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 4.26 6 5.92 6 7.8h12c0-1.88-.97-3.54-2.47-4.64zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg>`;

    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");
    const appsWrapper = document.getElementById("appsWrapper");
    const emptyState = document.getElementById("emptyState");
    const defaultHint = document.getElementById("defaultHint");

    let currentQuery = "";

    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderApps() {
      const query = currentQuery.trim().toLowerCase();
      appsWrapper.innerHTML = "";

      if (query.length === 0) {
        // By default: pure black screen, no apps listed!
        defaultHint.style.display = "flex";
        emptyState.style.display = "none";
        return;
      }

      defaultHint.style.display = "none";
      const filtered = APPS.filter(name => name.toLowerCase().includes(query));

      if (filtered.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        filtered.forEach(appName => {
          const item = document.createElement("div");
          item.className = "app-item";
          item.innerHTML = `
            <div class="app-icon">${robotSvg}</div>
            <div class="app-title">${appName}</div>
          `;
          item.onclick = () => {
            alert(`Launched ${appName}!`);
          };
          appsWrapper.appendChild(item);
        });
      }
    }

    searchInput.addEventListener("input", (e) => {
      currentQuery = e.target.value;
      searchClear.style.display = currentQuery ? "block" : "none";
      renderApps();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      currentQuery = "";
      searchClear.style.display = "none";
      searchInput.focus();
      renderApps();
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = currentQuery.trim().toLowerCase();
        const matches = APPS.filter(name => name.toLowerCase().includes(query));
        if (matches.length > 0) {
          alert(`Launched top match: ${matches[0]}`);
          searchInput.value = "";
          currentQuery = "";
          searchClear.style.display = "none";
          renderApps();
        }
      }
    });

    renderApps();
  </script>
</body>
</html>
